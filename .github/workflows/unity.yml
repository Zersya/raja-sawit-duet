name: Unity

# Tes dan build APK Android di cloud tiap push.
# Tes EditMode jalan di dalam job build (CiBuild.BuildAndroid), karena unity-test-runner belum mendukung aktivasi lewat akun.
# Butuh 2 secret di Settings > Secrets and variables > Actions: UNITY_EMAIL dan UNITY_PASSWORD.
# game-ci/unity-builder@v6 mengaktifkan lisensi Personal lewat akun Unity, tanpa file .ulf.

on:
  push:
  workflow_dispatch:

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sim:
    name: Tes simulasi (dotnet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test tools/sim-check

  lisensi:
    name: Cek secret lisensi Unity
    runs-on: ubuntu-latest
    outputs:
      ada: ${{ steps.cek.outputs.ada }}
    steps:
      - id: cek
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "ada=true" >> "$GITHUB_OUTPUT"
          else
            echo "ada=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret UNITY_EMAIL atau UNITY_PASSWORD belum dipasang, jadi tes Unity dan build APK dilewati."
          fi

  android:
    name: Tes EditMode dan build APK Android
    needs: lisensi
    if: needs.lisensi.outputs.ada == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-
      - uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildName: RajaSawit
          buildMethod: RajaSawit.EditorTools.CiBuild.BuildAndroid
          androidExportType: androidPackage
      - uses: actions/upload-artifact@v4
        with:
          name: RajaSawit-APK
          path: build/Android
          retention-days: 14
